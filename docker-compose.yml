services:

  ggserve:
    build: 
      context: .
      dockerfile: ./.devcontainer/container-ggserve/Dockerfile

    volumes:
      - ..:/workspaces:cached
      - ../data:/data
      
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

# Front-end
  ggapp-react:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces:cached
    network_mode: service:ggserve
    #network_mode: bridge
